[project]
name = "cyberlab-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3", "pymysql>=1.1,<2", "pydantic-settings>=2.5,<3", "alembic>=1.13,<2", "argon2-cffi>=23.1,<26", "pyyaml>=6,<7"]

[dependency-groups]
dev = ["pytest>=9.0.3,<10", "httpx>=0.27,<1", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
